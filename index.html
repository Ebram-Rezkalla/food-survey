<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Domandina per te Habibty❤️</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #ffe4e1;
            overflow: hidden; /* Fondamentale: impedisce la comparsa delle barre di scorrimento */
            text-align: center;
        }

        .container {
            background: white;
            padding: 2.5rem;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            width: 85%;
            max-width: 400px;
            position: relative;
            z-index: 10;
        }

        h1 { color: #d63384; margin-bottom: 2rem; font-size: 1.8rem; }

        .btn-group {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
            height: 60px; /* Spazio riservato per i bottoni */
        }

        button {
            padding: 12px 25px;
            font-size: 1.1rem;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        #btn-si, #btn-si-2 { background-color: #4caf50; color: white; }
        #btn-no, #btn-no-2 { background-color: #f44336; color: white; }

        /* Classe applicata quando il bottone deve iniziare a scappare */
        .scappa {
            position: fixed; /* Fixed è meglio di absolute per non sparire */
            z-index: 9999;
            transition: all 0.1s ease; /* Movimento più fluido */
        }

        .hidden { display: none; }
    </style>
</head>
<body>

    <div id="schermata1" class="container">
        <h1>Habibty stasera Kebab? 🥙</h1>
        <div class="btn-group">
            <button id="btn-si">SÌ</button>
            <button id="btn-no">NO</button>
        </div>
    </div>

    <div id="schermata2" class="container hidden">
        <h1>Sabato andiamo alla Pasticceria Adriatica? 🥐</h1>
        <div class="btn-group">
            <button id="btn-si-2">SÌ</button>
            <button id="btn-no-2">NO</button>
        </div>
    </div>

    <script>
        // Funzione corretta per far scappare il bottone SENZA farlo sparire
        function scappa(bottone) {
            bottone.classList.add('scappa');
            
            const padding = 50; // Margine dai bordi dello schermo
            const maxX = window.innerWidth - bottone.offsetWidth - padding;
            const maxY = window.innerHeight - bottone.offsetHeight - padding;

            // Genera coordinate che siano sempre dentro il rettangolo visibile
            const randomX = Math.max(padding, Math.floor(Math.random() * maxX));
            const randomY = Math.max(padding, Math.floor(Math.random() * maxY));

            bottone.style.left = randomX + 'px';
            bottone.style.top = randomY + 'px';
        }

        // --- SCHERMATA 1: SÌ scappa ---
        const bSi1 = document.getElementById('btn-si');
        const bNo1 = document.getElementById('btn-no');
        
        bSi1.addEventListener('mouseover', () => scappa(bSi1));
        bSi1.addEventListener('touchstart', (e) => { e.preventDefault(); scappa(bSi1); }); // Per mobile

        bNo1.addEventListener('click', () => {
            document.getElementById('schermata1').classList.add('hidden');
            document.getElementById('schermata2').classList.remove('hidden');
        });

        // --- SCHERMATA 2: NO scappa ---
        const bNo2 = document.getElementById('btn-no-2');
        const bSi2 = document.getElementById('btn-si-2');

        bNo2.addEventListener('mouseover', () => scappa(bNo2));
        bNo2.addEventListener('touchstart', (e) => { e.preventDefault(); scappa(bNo2); });

        bSi2.addEventListener('click', () => {
            // Effetto coriandoli!
            confetti({
                particleCount: 150,
                spread: 70,
                origin: { y: 0.6 },
                colors: ['#ff69b4', '#ff1493', '#ffffff']
            });
            
            bSi2.innerHTML = "EVVIVA! 😍";
            setTimeout(() => {
                alert("Sapevo che avresti detto di sì! Sabato colazione top! ❤️🥐");
            }, 500);
        });
    </script>
</body>
</html>
