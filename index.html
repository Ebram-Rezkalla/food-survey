<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Domandina per te ❤️</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #ffe4e1;
            overflow: hidden;
            text-align: center;
        }

        .container {
            background: white;
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 90%;
            max-width: 400px;
            position: relative;
        }

        h1 { color: #d63384; margin-bottom: 2rem; }

        .btn-group {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }

        button {
            padding: 12px 25px;
            font-size: 1.2rem;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        #btn-si, #btn-si-2 { background-color: #4caf50; color: white; }
        #btn-no, #btn-no-2 { background-color: #f44336; color: white; }

        /* Classe per il bottone che scappa */
        .scappa {
            position: absolute;
            z-index: 1000;
        }

        .hidden { display: none; }
    </style>
</head>
<body>

    <div id="schermata1" class="container">
        <h1>Stasera Kebab? 🥙</h1>
        <div class="btn-group">
            <button id="btn-si">SÌ</button>
            <button id="btn-no">NO</button>
        </div>
    </div>

    <div id="schermata2" class="container hidden">
        <h1>Sabato andiamo alla Pasticceria Adriatica? 🥐</h1>
        <div class="btn-group">
            <button id="btn-si-2">SÌ</button>
            <button id="btn-no-2">NO</button>
        </div>
    </div>

    <script>
        const btnSi1 = document.getElementById('btn-si');
        const btnNo1 = document.getElementById('btn-no');
        const btnSi2 = document.getElementById('btn-si-2');
        const btnNo2 = document.getElementById('btn-no-2');
        
        const schermata1 = document.getElementById('schermata1');
        const schermata2 = document.getElementById('schermata2');

        // Funzione per far scappare un bottone
        function scappa(bottone) {
            bottone.classList.add('scappa');
            const x = Math.random() * (window.innerWidth - bottone.offsetWidth);
            const y = Math.random() * (window.innerHeight - bottone.offsetHeight);
            bottone.style.left = x + 'px';
            bottone.style.top = y + 'px';
        }

        // --- LOGICA SCHERMATA 1 ---
        // Il SÌ scappa
        btnSi1.addEventListener('mouseover', () => scappa(btnSi1));
        btnSi1.addEventListener('click', (e) => e.preventDefault());

        // Il NO porta alla schermata 2
        btnNo1.addEventListener('click', () => {
            schermata1.classList.add('hidden');
            schermata2.classList.remove('hidden');
        });

        // --- LOGICA SCHERMATA 2 ---
        // Il NO scappa
        btnNo2.addEventListener('mouseover', () => scappa(btnNo2));
        btnNo2.addEventListener('click', (e) => e.preventDefault());

        // Il SÌ finale (puoi aggiungere un alert o un'altra pagina)
        btnSi2.addEventListener('click', () => {
            alert("Ottima scelta! ❤️ Prenoto subito alla Pasticceria Adriatica!");
        });
    </script>
</body>
</html>
