<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Domandina per te Habibty❤️</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #ffe4e1;
            overflow: hidden;
            text-align: center;
        }

        .container {
            background: white;
            padding: 2.5rem;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            width: 85%;
            max-width: 450px;
            position: relative;
            z-index: 10;
        }

        h1 { color: #d63384; margin-bottom: 2rem; font-size: 1.6rem; line-height: 1.4; }

        .btn-group {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
            min-height: 60px;
        }

        button {
            padding: 12px 25px;
            font-size: 1.1rem;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.1s;
        }

        .btn-green { background-color: #4caf50; color: white; }
        .btn-red { background-color: #f44336; color: white; }
        .btn-next { background-color: #d63384; color: white; margin-top: 10px; }

        .scappa {
            position: fixed;
            z-index: 9999;
            transition: all 0.1s ease;
        }

        .hidden { display: none; }
    </style>
</head>
<body>

    <div id="schermata1" class="container">
        <h1>Stasera Kebab? 🥙</h1>
        <div class="btn-group">
            <button id="btn-si-1" class="btn-green">SÌ</button>
            <button id="btn-no-1" class="btn-red">NO</button>
        </div>
    </div>

    <div id="schermata-msg" class="container hidden">
        <h1>Come No?! Se mi avevi detto che ti andava... 🙂</h1>
        <button id="btn-vai-oltre" class="btn-next">Vabbè dai... 🙄</button>
    </div>

    <div id="schermata2" class="container hidden">
        <h1>Allora sabato andiamo alla Pasticceria Adriatica? 🥐</h1>
        <div class="btn-group">
            <button id="btn-si-2" class="btn-green">SÌ</button>
            <button id="btn-no-2" class="btn-red">NO</button>
        </div>
    </div>

    <script>
        // Funzione per far scappare il bottone
        function scappa(bottone) {
            bottone.classList.add('scappa');
            const padding = 60;
            const maxX = window.innerWidth - bottone.offsetWidth - padding;
            const maxY = window.innerHeight - bottone.offsetHeight - padding;

            const randomX = Math.max(padding, Math.floor(Math.random() * maxX));
            const randomY = Math.max(padding, Math.floor(Math.random() * maxY));

            bottone.style.left = randomX + 'px';
            bottone.style.top = randomY + 'px';
        }

        // --- SCHERMATA 1 ---
        const bSi1 = document.getElementById('btn-si-1');
        const bNo1 = document.getElementById('btn-no-1');
        
        // Qui il SÌ scappa
        bSi1.addEventListener('mouseover', () => scappa(bSi1));
        bSi1.addEventListener('touchstart', (e) => { e.preventDefault(); scappa(bSi1); });

        // Clicca NO -> Messaggio intermedio
        bNo1.addEventListener('click', () => {
            document.getElementById('schermata1').classList.add('hidden');
            document.getElementById('schermata-msg').classList.remove('hidden');
            // Resettiamo il bottone scappato per la prossima fase se necessario
            bSi1.classList.remove('scappa');
            bSi1.style.position = "static";
        });

        // --- PASSAGGIO ALLA PASTICCERIA ---
        document.getElementById('btn-vai-oltre').addEventListener('click', () => {
            document.getElementById('schermata-msg').classList.add('hidden');
            document.getElementById('schermata2').classList.remove('hidden');
        });

        // --- SCHERMATA 2 ---
        const bNo2 = document.getElementById('btn-no-2');
        const bSi2 = document.getElementById('btn-si-2');

        // Qui il NO scappa
        bNo2.addEventListener('mouseover', () => scappa(bNo2));
        bNo2.addEventListener('touchstart', (e) => { e.preventDefault(); scappa(bNo2); });

        bSi2.addEventListener('click', () => {
            confetti({
                particleCount: 150,
                spread: 70,
                origin: { y: 0.6 },
                colors: ['#ff69b4', '#ff1493', '#ffffff']
            });
            
            bSi2.innerHTML = "EVVIVA! 😍";
            setTimeout(() => {
                alert("Sapevo che avresti detto di sì!😂😂 Sabato colazione top! ❤️🥐");
            }, 600);
        });
    </script>
</body>
</html>
